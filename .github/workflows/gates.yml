# The merge gates, executed off this machine.
#
# Until 2026-08-10 every gate ran only on the owner's laptop, by hand. `master` carried zero
# commit statuses and no branch protection, so "22 gates, all green" was a claim about a habit
# rather than about the published commit - the exact shape of defect the gates themselves exist to
# catch, one level up (CI_POLICY 3).
#
# This calls `tools/check_gates.py` rather than listing gates itself. A CI definition that
# enumerates its own gates is a second copy of the inventory, and master TZ section 8 forbids one
# logic in two places: the copy drifts, and the drift is invisible until a gate silently stops
# running.
#
# Some gates cannot run here and are reported UNAVAILABLE, not PASS: gates 2 and 3 re-extract the
# owner's 116 course PDFs, which are the requirements source and are not in the repository, and
# gates 23, 24 and 26 need `data/` or the scheduling machine. The runner prints which gates did not
# run and never claims "all gates pass" when any did not.
#
# The COUNT is deliberately not written here - it lives in `HANDOFF.md` section 2, generated
# (`AGENTS.md` section 10.5). This comment read "all 22 gates" and "20 of 22" until 2026-08-25, by
# which point neither figure had been right for two weeks, and nothing scans a YAML comment.

name: gates

# **Every commit on a branch ran this job TWICE**, measured 2026-09-04: `push: ["**"]` fired on the
# branch and `pull_request` fired on the same commit, giving two `gates` runs of eleven and thirteen
# minutes for one change. The `concurrency` block below could not collapse them - a push carries
# `refs/heads/<branch>` and a pull_request carries `refs/pull/<n>/merge`, so the two land in
# different groups by construction and neither cancels the other.
#
# `push` is now `master` only. A branch is still checked, on the `pull_request` event, which is the
# commit that actually gets merged - and every change here reaches `master` through a PR, so nothing
# loses coverage. What is lost is the run on a branch with no PR open yet, and that run was checking
# a commit nobody had proposed.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A superseded push has nothing to tell anyone; cancel it rather than pay for it.
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # windows-latest, not ubuntu. This is a Windows-first single-user system - the scheduled run is
    # a .cmd wrapper driven by Task Scheduler - and CI whose platform differs from the only machine
    # that matters would test a configuration nobody runs.
    runs-on: windows-latest
    # Raised from 20 on 2026-08-30, after a run was CANCELLED at 20m05s while its twin on the same
    # commit passed at 15m10s. The cap was set when the suite was half this size; it is now 44
    # gates, over a thousand tests and a mutation gate that copies `src/` once per mutant, and the
    # job needs about fifteen minutes with runner-speed variance on top.
    #
    # **A cap the healthy suite brushes against is not a check, it is a coin flip**, and a red
    # `gates` on `master` for no reason is exactly the noise `CI_POLICY.md` §3 says gets a gate
    # bypassed. The cancellation is still there to stop a hung job burning minutes - that is what
    # this number is for, and thirty-five keeps it while leaving real headroom.
    #
    # The log located it exactly: the cancelled run stopped inside gate 34, the mutation gate, which
    # is the most expensive one and the last heavy thing in the sequence.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          # Gate 16 reads `git worktree list` and `git branch --merged master`. With the default
          # shallow single-branch clone there is no local `master` to compare against on a branch
          # build, so the merge state it prints would be wrong rather than absent.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter the owner's venv runs (3.14.0) rather than floating: a gate
          # suite that passes here on a different minor than the daily run uses is evidence about
          # the wrong environment.
          python-version: "3.14"

      - name: Install
        # From the lock, so a CI failure means this commit changed something rather than a
        # dependency having shipped a release overnight. `--no-deps` on the package itself keeps
        # the pins authoritative: without it pip is free to re-resolve and quietly unpin.
        # Gate 18 is what keeps the lock honest against pyproject.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Preflight
        # The same check the scheduled run makes, for the same reason: prove the environment before
        # blaming the code. It reads the dependency list out of pyproject.toml.
        run: python tools/preflight.py

      - name: Gates
        run: python tools/check_gates.py
