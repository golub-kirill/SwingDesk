# Strategy card registry.
#
# A card is the unit that gets versioned, tested and accepted (STRATEGY_CARD_SPEC 1). This file is
# the MACHINE-READABLE half; the reasoning for each card lives beside it in docs/02-domain/, the
# same split components.yml and COMPONENT_REGISTRY_SPEC.md already use.
#
# Two binding rules from STRATEGY_CARD_SPEC 5, and both are enforced by tools/verify_cards.py:
#
#   1. A card REFERENCES components; it does not restate their formulas. `components` holds ids
#      that must resolve in components.yml. Copying a formula here would be the one-logic-in-two-
#      places failure master TZ section 8 forbids.
#   2. A card is versioned AS A WHOLE. Changing any field creates a new version and RESETS any
#      validation claim that depended on the earlier frozen definition (Production Rules 3.7).
#
# status is one of:
#   Untested   - declared, never tested. The only honest status for a new card.
#   Testing    - a pre-registration exists and is running.
#   Validated  - a reported study cleared the Track B criteria. NOTHING is Validated today, and
#                `criteria.yml` v1.1.0 requires journalled trades for that, not a backtest.
#   Retired    - superseded or killed. Never deleted.
#
# `blocked_by` is not a defect list. A card that names what stops it from running is doing the job
# a card exists for: it converts "what should we build?" into a list somebody can close. ROADMAP G6
# is defined as "every component a live strategy card needs is active", and until this file existed
# that criterion had no denominator.

cards:

  - card: CARD-001
    version: 1
    name: Cross-sectional relative strength
    status: Untested
    owner_selected: 2026-08-24
    document: docs/02-domain/CARD-001-cross-sectional-relative-strength.md

    rationale: >-
      Rank the admitted universe by strength relative to its index and hold the strongest few,
      rather than timing each name on its own history. The economic claim is cross-sectional
      momentum: recent relative winners continue to outperform recent relative losers over a swing
      horizon. THE COURSE FLAGS THIS AS AN UNTESTED HYPOTHESIS ITSELF - M31-T0465 carries
      claim_type "Untested Hypothesis" - so this card inherits Untested and cannot be argued from
      the course's authority. It is a different FAMILY from the time-series breakout PR-005
      refuted, which is the reason it was chosen first.

    scope:
      markets: [US]
      instruments: [equity, etf]
      timeframe: daily
      excluded: >-
        Canada. DR-003 gap 1 - the NASDAQ Trader files cover US venues only and this project cannot
        enumerate .TO instruments, so the Canadian universe is a list rather than a rule. BR-9
        requires results per country, so this card is a US-only card until that is solved.
      allowed_regimes: unset
      holding_horizon: exit.max_holding_period

    universe:
      rule: DR-003
      parameters: [universe.min_price, universe.min_adtv_20d, universe.min_bar_history]

    # The selection rule IS the family. All three inputs are unset, so the card refuses rather than
    # ranking by whatever order the system happens to have - ALLOCATION_SPEC 6 rule 4.
    selection:
      measure: relative strength against the index
      benchmark: rs.benchmark
      form: rs.benchmark_form
      lookback: rs.lookback
      method: rs.ranking_method
      cutoff: screen.relative_strength_rule

    # STRATEGY_CARD_SPEC 2: required must hold, confirming may be absent, prohibiting is
    # NON-COMPENSATORY and can never be outvoted by any number of confirming conditions.
    conditions:
      required:
        - admitted by the DR-003 liquidity rule on the decision date
        - ranked inside the selection cutoff on the decision date
        - a stop can be placed below the entry (exit.atr_stop_multiple x ATR(14))
      confirming: []
      prohibiting:
        - the instrument's series is stale (DR-015 freshness gate)
        - a split took effect after the position's stop was set (DR-016 split guard)
        - the candidate would breach any DR-006 portfolio cap

    entry:
      trigger: >-
        Membership of the selection set at the close of the decision session. There is no separate
        price trigger, and that is a property of the family rather than an omission - a
        cross-sectional rule selects, it does not wait for a level.
      method: next session's open
      maximum_entry: unset

    invalidation:
      initial_stop: exit.atr_stop_multiple
      cancellation: falls out of the selection cutoff before the entry fill

    sizing:
      rule: risk.per_trade_pct
      portfolio_constraints:
        - risk.max_open_risk
        - risk.max_concurrent_positions
        - risk.max_sector_risk
        - risk.correlation_threshold
        - risk.max_position_value
        - risk.liquidity_cap_order_to_adtv_pct

    exits:
      stop: exit.atr_stop_multiple
      time: exit.max_holding_period
      targets: unset
      trailing: unset
      partials: unset

    data:
      requires: [daily RAW bars, benchmark bars (rs.benchmark), sector classification]
      on_missing: refuse with a coded DATA skip; never guess (FAIL_CLOSED_POLICY 3)
      on_stale: DR-015
      on_revised: DR-016

    # ONE of the four is `active` as of 2026-08-30 (M31-T0464, the measure - DR-024). The other
    # three are `registered`. That ratio is exactly what G6 measures - "every component a live
    # strategy card needs is active" - and this list is the first denominator it has ever had.
    components:
      - M31-T0464-v5.0   # Relative strength против индекса - the measure
      - M31-T0465-v5.0   # Long strongest / short weakest - the hypothesis, flagged by the course
      - M33-T0487-v5.0   # Фильтр по относительной силе - the screen
      - M77-T1138-v4.0   # Relative strength - the setup-stage observation

    evidence: null
    validation_status: Untested

    # What stops this card running. Each is a real, checkable obstacle - not a wish list.
    blocked_by:
      - id: unset-selection
        what: >-
          rs.lookback, rs.ranking_method, rs.benchmark_form and screen.relative_strength_rule are
          all unset. PR-012 was the study that would have set them and it REFUSED a verdict on
          2026-08-24 for want of sample, so they stay unset.
        why: >-
          The card refuses rather than defaulting. ALLOCATION_SPEC 3 says an ordering adopted from
          the course does not inherit its authority and needs a PRE-REGISTRATION before it selects
          a trade - so these get values from a study, never from a decision record. A refused study
          sets nothing: it reports the measurement and declines the verdict, which is the design
          working.
      - id: the-capacity-cap-caps-the-sample
        what: >-
          CLOSED 2026-08-24: validation/backtest/book.py:run_book exists and PR-012 ran three arms
          through it over 2,388 sessions. What that RUN found is a new blocker, and a harder one -
          a four-position book held at most 20 sessions produces about 50 entries a year, so a
          2.9-year holdout can supply roughly 145 trades against b.min_sample's doubled floor of
          200. PR-012 observed 181 to 203 and refused a verdict.
        why: >-
          No amount of universe deepening fixes this - the study already deepened the store from a
          median of 510 bars to 2,512 and the ceiling did not move, because the binding constraint
          is risk.max_concurrent_positions against exit.max_holding_period and BOTH ARE RATIFIED.
          Every route out changes something ratified or the study's shape; PR-012's report section
          "Why the sample is structurally short" lists them with what each costs.
      - id: benchmark-form-unset
        what: >-
          CLOSED in part 2026-08-24 by DR-018. SPY, QQQ, IWM, IVV and VOO are stored, five years
          each, and rs.benchmark is SPY. What remains unset is rs.benchmark_form - HOW a candidate
          is compared to it.
        why: >-
          The form decides whether the benchmark means anything at all. Measured: the usual
          point-to-point ratio is a strictly monotone transform of the name's own return on any one
          cross-section, so it ranks EXACTLY as raw return does (Spearman 1.000000 across 15
          benchmark x lookback pairs over 1148 names) and the benchmark is decorative. A
          path-dependent form is not such a transform and reads about 0.6 against raw return - a
          different signal - and there the index choice bites, SPY against QQQ at 0.616. So the
          form is a strategy choice and ALLOCATION_SPEC 3 sends it to a pre-registration.
      - id: components-not-active
        what: >-
          NARROWED 2026-08-30 by DR-024: M31-T0464 is `active`. The daily run computes the RS line
          for every candidate against rs.benchmark and the report prints it with its validation
          status, which is the condition COMPONENT_REGISTRY_SPEC 3 attaches to `active` - a
          component's output must appear somewhere with its status beside it. It is the second
          active component in the project and the first a live card names.
          The other three - M31-T0465, M33-T0487, M77-T1138 - are still `registered`.
        why: >-
          COMPONENT_REGISTRY_SPEC 3 - `active` needs parameter VALUES, and this card's selection
          inputs come from PR-012. M31-T0464 itself declares no parameters, so artefacts alone would
          have allowed activation from 2026-08-24; it was held at `specified` because nothing CALLED
          it, and a component nothing calls declared active is a status claiming more than the
          system does (AGENTS.md 3). DR-024 supplied the caller rather than flipping the flag.
          THE MEASURE IS NOT THE SELECTION. RS is computed and reported and selects nothing: the
          three unset-selection blockers above are untouched, and ALLOCATION_SPEC 3 still sends
          rs.benchmark_form and the rest to a pre-registration. What changed is that the card's own
          measure is now visible before anything is ranked by it.
          M77-T1138 is the same measure at the Setup stage and is deliberately NOT claimed by the
          same function: Production Rules 3.8 forbids two components sharing one definition and
          gate 11 enforces it. Whether that row names something distinct needs the source PDFs,
          which are not in this repository.

    kill_criteria:
      - k.programme_exhausted
      - k.strategy_rejected
      - b.deflated_sharpe
