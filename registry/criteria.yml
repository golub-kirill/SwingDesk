# Success and kill criteria.
#
# Two tracks, because the system and the strategy are separate accountabilities. Merging them is
# what made the previous project unfalsifiable.
#
# Structure is frozen. Values are configurable - that is what "flexible" means here.
#
# status: proposed | owner-set | ratified | met | failed
#   proposed   drafted, awaiting owner ratification
#   owner-set  the value came from the owner directly, not drafted here
#   ratified   frozen; may not be edited after seeing a result it governs
#
# See docs/00-charter/SUCCESS_AND_KILL_CRITERIA.md.

version: 1.1.1
date: 2026-08-15
status: ratified          # v1.1.0 owner-ratified 2026-08-08 and frozen; see amendments below

# Amendments are appended, never applied in place. v1.0.0's content stays exactly as ratified;
# a later version may ADD a criterion, and may not edit one that has seen a result it governs.
amendments:
  - version: 1.1.0
    date: 2026-08-08
    status: ratified        # owner ratified 2026-08-08, with the inaction clause added
    change: >-
      Adds k.track_a_timebox - the Track A time box deliberately left absent at v1.0.0 and
      scheduled by k.timebox_review to be set at G5 from measured throughput.
    note: >-
      Ratified with one change to the draft. As first written the box started at "the first
      scheduled daily run" and the owner deferred scheduling in the same session, which would have
      made it a criterion that could never fire - the REQ-VALIDATION-001 shape, and one gate 3g
      cannot catch because the trigger references no parameter. The second clause fixes that: a
      kill criterion evadable by inaction is not a kill criterion.

  - version: 1.1.1
    date: 2026-08-15
    status: ratified        # owner ratified 2026-08-15, in the same session that requested it
    target: k.track_a_timebox.note
    change: >-
      Corrects a stale sentence in k.track_a_timebox's note (v1.1.0). Does not touch TRIGGER or
      VALUE - both were already written to handle this exact case and needed no change. v1.1.0's
      note text is left byte-for-byte as ratified, per this file's own header rule; see the
      pointer comment at the field itself for where this correction lives.
    note: >-
      v1.1.0's note said "the clock has not started: no daily run is scheduled yet, and the owner
      deferred scheduling on 2026-08-08." That was overtaken the next day. VERIFIED 2026-08-15
      against data/daily_run.log and git history, not re-typed from memory: the Task Scheduler job
      was created 2026-08-09 (two runs logged that evening). Its first 18:30 scheduled attempt,
      2026-08-10, failed on batteries and left no log entry near the window (commit 664e84a) - the
      exact failure the wrapper's own header warns about, arriving on day one. Clean scheduled-window
      runs are logged 2026-08-11 through 2026-08-14 (`tools/track_a_streak.py`: 4/20 as of this
      writing). So the clock DID start: first scheduled daily run 2026-08-09, per the trigger's own
      wording. The 120-day branch of k.track_a_timebox governs; the 180-day-from-ratification
      fallback is moot and stays on record as what it was, not deleted.
      The same stale sentence was independently duplicated in prose in
      `docs/00-charter/SUCCESS_AND_KILL_CRITERIA.md` §5, corrected forward there in this same change
      using this file's own §10.5 convention (strike through, do not silently rewrite) rather than
      as a second, disconnected governance track for one fact.

# ---------------------------------------------------------------------------
# Track A - is the system sound?
# Measurable in weeks. Independent of market outcome. Satisfiable while every
# setup remains Untested. This is the G0 gate.
# ---------------------------------------------------------------------------
track_a:
  - id: a.run_completes
    criterion: The daily run completes and produces a report before the next session open
    value: 20 consecutive trading days
    measured_by: run manifests
    status: ratified

  - id: a.decisions_coded
    criterion: Every candidate leaves the run with a decision and a reason code
    value: 100%
    measured_by: journal query over scan results
    status: ratified
    note: Course rule - "Нет кандидатов без следующего действия" (M32/M33 operational standard).

  - id: a.no_uncoded_failures
    criterion: Every refusal carries a skip or error code; no silent failures
    value: 0 uncoded
    measured_by: log and journal audit
    status: ratified

  - id: a.reproducible
    criterion: A re-run from a stored manifest reproduces the control run byte-identically
    value: byte-identical
    measured_by: tools determinism check
    status: ratified
    note: >-
      Course states this as an operating procedure, not an engineering preference - the return
      condition after a screener failure is "повторный run совпал с контрольным".

  - id: a.process_compliance_core
    criterion: Plan, stop and journal present for every taken trade
    value: 100%
    measured_by: Process compliance (Appendix D) restricted to these three
    status: ratified
    note: The only hard numeric gate the course states (Appendix S, first 20 trades).

  - id: a.process_compliance_overall
    criterion: Overall process compliance across all checklist items
    value: '>= 95%'
    measured_by: Process compliance (Appendix D)
    status: ratified

  - id: a.no_critical_violations
    criterion: No Critical-severity error codes recorded
    value: 0
    measured_by: error codes (CODES.md) filtered to Critical
    status: ratified

# ---------------------------------------------------------------------------
# Track B - is there an edge?
# Pre-registered PER STRATEGY CARD, never project-global. Nothing here is
# evaluated until the minimum sample is reached.
# ---------------------------------------------------------------------------
track_b:
  - id: b.min_sample
    criterion: Minimum closed trades before any verdict on a strategy card
    value: 100
    measured_by: journal, per strategy and version
    status: ratified
    note: >-
      The course's own figure (Appendix S, "План первых 100 реальных сделок"). Below roughly this
      the expectancy CI is too wide to act on, because the right tail dominates the mean.

  - id: b.expectancy
    criterion: Expectancy positive, net of all costs, bootstrap CI excluding zero
    value: 'E[R] > 0, CI excludes 0'
    measured_by: Appendix D expectancy over the pre-registered sample
    status: ratified
    note: Costs = commission, spread, slippage, borrow, FX. "После расходов" (Appendix D).

  - id: b.deflated_sharpe
    criterion: Deflated Sharpe computed on the CUMULATIVE trial count across the whole programme
    value: '> 0'
    measured_by: multiple-testing accounting
    status: ratified
    note: >-
      With ~460 registered components the search space is large enough that per-strategy
      significance is meaningless. The trial count carries forward across every pre-registration.

  - id: b.benchmark_relative
    criterion: Risk-adjusted return above buy-and-hold on the same universe, net of costs
    value: 'above benchmark'
    measured_by: paired comparison on one snapshot
    status: ratified

  - id: b.era_stability
    criterion: The effect does not sign-flip across eras and is not carried by a single stretch
    value: no sign flip
    measured_by: stress / drop-best-era analysis
    status: ratified

  - id: b.survivorship_caveat
    criterion: Every Track B result is reported with its survivorship-bias marker
    value: mandatory
    measured_by: evidence record field
    status: ratified
    note: >-
      Not a threshold - a reporting obligation. No free source serves delisted instruments
      (ADR-0001 condition 6), so every historical number is optimistic by an unknown amount.

# ---------------------------------------------------------------------------
# Kill criteria.
# Boxed by time and sample, not only by outcome. A project with no kill
# criterion does not fail - it just continues.
# ---------------------------------------------------------------------------
kill:
  - id: k.project_timebox
    scope: project
    trigger: G5 (walking skeleton green in CI) not reached within the time box
    value: 2 months from G0 close
    action: Stop building. The system cannot be delivered at the available throughput.
    status: owner-set
    date: 2026-08-01
    note: >-
      Deliberately boxes G5 rather than Track A. Track A contains its own 20-trading-day observation
      window, so timeboxing it would conflate "can this be built" with "is it stable". Owner
      capacity is ~40 h/week, so this is ~350 working hours - generous for a walking skeleton, which
      means the real risk is scope drift into the 460-component catalogue rather than time.

  - id: k.timebox_review
    scope: project
    trigger: G5 reached, or the G5 time box expires
    value: at G5
    action: >-
      Set the Track A time box using measured throughput from the G5 build, and issue this file as
      v1.1.0 with that value added.
    status: met
    date: 2026-08-01
    met_on: 2026-08-08
    note: >-
      The Track A time box was deferred on purpose - an evidence-based number rather than a guess.
      MET 2026-08-08: k.track_a_timebox added and v1.1.0 issued. It fired when G5 closed on
      2026-08-02 and sat unactioned for six days, which is the honest record of how long a criterion
      can fire in a ratified file without anyone noticing. v1.0.0 stays on record.

  - id: k.strategy_rejected
    scope: strategy card
    trigger: After b.min_sample, the expectancy CI lies entirely below the benchmark
    value: CI entirely below benchmark
    action: Set validation status Rejected. Retire the card. The project continues.
    status: ratified

  - id: k.programme_exhausted
    scope: programme
    trigger: All strategy cards Rejected or Retired, and no new premise clears the prereg
      refutation check
    value: no card active, no new premise
    action: >-
      Convert to journal and statistics only. Keep the recording and review value, abandon signal
      generation.
    status: ratified

  - id: k.track_a_timebox
    # NOTE BELOW IS STALE as of 2026-08-15: it says the clock has not started. It has - see the
    # v1.1.1 amendment above for the correction and its evidence. Left untouched, byte-for-byte,
    # per this file's own header rule; the amendment is the record, this comment is a pointer to it.
    scope: project
    trigger: >-
      Track A's four run-measurable criteria (a.run_completes, a.decisions_coded,
      a.no_uncoded_failures, a.reproducible) not all met within the time box, counted from the
      first scheduled daily run - or no daily run scheduled at all within 180 days of ratification
    value: >-
      120 calendar days from the first scheduled daily run, OR 180 calendar days from ratification
      (2026-08-08) if no daily run has been scheduled by then
    action: >-
      If the box expired WITH a run scheduled: stop and re-open the data-tier decision (D10). Three
      failed attempts at a 20-session window is evidence the daily run cannot be made reliable on
      this source, not evidence to keep trying on it.
      If it expired with NO run ever scheduled the finding is different and larger: the system is
      not being operated. Restate the project as documentation-and-research only and stop
      maintaining a live contour that nothing uses.
    status: ratified
    date: 2026-08-08
    note: >-
      Derived from measured throughput, as k.timebox_review requires. MEASURED: first commit
      2026-08-01, walking skeleton end to end 2026-08-02 - G5 in one day against a two-month box.
      The build side is therefore not the constraint, and boxing it again would box the wrong
      thing. What cannot be compressed by throughput is elapsed MARKET time: a.run_completes needs
      20 CONSECUTIVE trading days, about 28 calendar days, and any missed session restarts the
      window. 120 days allows three full attempts plus roughly five weeks to diagnose and fix
      between them. 60 would allow two, so the first outage would put the box on a knife edge and
      turn a free-tier data gap into a kill trigger - the exact failure SUCCESS_AND_KILL_CRITERIA
      section 5 warns about. Beyond 120 the box stops discriminating: three failures is already
      the answer. STARTS AT THE FIRST SCHEDULED DAILY RUN, not at ratification, because nothing
      accumulates before then - the lesson from k.project_timebox, which boxed G5 and was reached
      in a day. The clock has not started: no daily run is scheduled yet, and the owner deferred
      scheduling on 2026-08-08 with the survivorship loss accepted - which is exactly why the
      second clause exists, because the first alone would have boxed nothing. The three
      trade-dependent Track A criteria (process compliance core and overall, no critical
      violations) are OUTSIDE this box - their pace is the owner's trading cadence, not the
      project's throughput, and boxing them would time-box the owner's discretion.

  - id: k.drawdown_pause
    scope: live
    trigger: Realised drawdown exceeds validation.max_allowable_drawdown
    value: see registry/parameters.yml validation.max_allowable_drawdown
    action: Pause - not kill. Reduce size per the risk-off ladder and review.
    status: ratified
    note: Course requires drawdown limits to automatically reduce size and trigger a pause (M69).

# ---------------------------------------------------------------------------
rules:
  - Criteria are frozen before the run that tests them.
  - Editing a criterion after seeing a result creates a new version and voids the claim
    (Production Rules 3.7, applied at project level).
  - Both branches are written in advance. A criterion with only a success branch is a hope.
  - All measurements are net of costs.
  - A negative result is a result. Reaching Rejected honestly is a success of the process.
