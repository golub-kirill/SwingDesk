    note: >-
      M74-T1110 requires measured live slippage to be compared against this, so the model must be
      the same shape as the measurement. Raised from DR-004's assumed 5bps to a figure measured
      from daily OHLC across 1,131 A-tier instruments (DR-005). Still `assumed`: a decision record
      is not a pre-registered study, however the number was arrived at.
