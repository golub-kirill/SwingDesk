  - id: regime.classifier_rule
    unit: rule
    value: "BREADTH_MEDIAN: share of universe above its own 200d SMA, split at the train-window median (0.647)"
    status: validated
    provenance: "validated:PR-002"
    note: >-
      FIRST VALIDATED PARAMETER. PR-002 (reported 2026-08-02) fitted thresholds on train, selected
      the variant on validation by STABILITY rather than by outcome, and measured separation on the
      test window only: BREADTH_LOW +0.2299R vs BREADTH_HIGH -0.1304R over 1183 trades, percentile
      100 against the registered null and 100 against a stricter date-block null added post-hoc.
      Holds under 3x cost stress.
      READ THE BOUND BEFORE USING THIS. Survivorship is absent, low-breadth periods are drawdowns,
      and the instruments that failed during those drawdowns are missing from the sample - a
      mechanism that would produce this exact result with no real effect present. Quantified
      post-hoc: if 2.3% of all trades are missing at -2R each, or 1.6% at -3R, concentrated in the
      low-breadth cell, the separation disappears. A delisted instrument is a halt and a severe
      loss, not a -1R trade, so those are the relevant rows - and over a three-year window
      containing a drawdown that share is likely rather than far-fetched. Spread proportionally
      across both cells it would take 34.9%, but delisting is not proportional.
      The verdict stands under the rule fixed before the run. The result is FRAGILE at a plausible
      magnitude. What survives confidently is only the weaker claim that breadth is not obviously
      irrelevant. Owner decision D10 (2026-08-02) reaffirmed the free tier knowing this, so the
      direction will not be confirmed.
      A regime is a gauge, not a source of confidence (M30-T0450); ACTING on it is M30-T0451, a
      separate Untested topic. See docs/prereg/results/PR-002-report.md.
    named_in: [M30-T0450, Appendix L]
    note: >-
      The course defines 11 regimes and the matrix of what each permits, and names the inputs
      (direction, ATR, ADX, participation), but no rule produces the label. Fully authored, and
      load-bearing for the whole strategy-selection matrix.
    ui_editable: false

