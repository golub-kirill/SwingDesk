  # ---- management: the lifetime of a proposal awaiting the owner (DR-013, ruled 2026-08-17) ----
  - id: management.proposal_expiry_days
    unit: trading days
    value: 3
    status: assumed
    provenance: assumed:DR-013
    read_by: swingdesk.presentation.cli:_expiry
    named_in: [US-010, "authored - the course names no proposal lifetime anywhere"]
    note: >-
      How long a NON-CRITICAL proposal (MOVE_STOP, PARTIAL_EXIT) stays answerable. A CRITICAL one
      (EXIT_NOW) never expires and never auto-applies - DR-013 section 2.2 and CHARTER A-001: a timer
      that exits a position is the system deciding with a delay.
      Trading days, not calendar days, so a Friday proposal is not aged out by a weekend in which no
      bar existed and no risk changed.
      Expiry is computed AT READ TIME and never written by a background job - there is no daemon here,
      and a status somebody must remember to write is the defect `pending` already avoids by defining
      pending as the ABSENCE of a response rather than a status column.
      Weakest part of DR-013 and it says so: 3 is a judgment about how long an observation on daily
      bars stays actionable, with no measurement behind it. The owner is the only instrument that can
      move it.
    ui_editable: true
