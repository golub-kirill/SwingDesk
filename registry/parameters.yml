# Parameter registry.
#
# Every threshold the system needs and the course does not supply. Seeded from the tier-2
# transcription; each entry names where the course mentions the concept without quantifying it.
#
# Rules (docs/02-domain/PARAMETER_REGISTRY.md):
#   - value: null means UNSET. An unset parameter makes its component return a coded refusal.
#   - provenance is mandatory once a value exists: assumed:<citation> | owner | validated:<evidence>
#   - changing a value creates a new component version and resets that component's validation status
#
# Enforced by tools/verify_parameters.py.

parameters:

  # ---- account (owner, 2026-08-01) ----
  - id: account.equity
    unit: USD
    value: 10000
    status: owner
    provenance: owner
    read_by: swingdesk.trade_management.sizing:size_long
    named_in: [Appendix C - "Equity × risk %"]
    note: Configurable default, not a constant. Single-user install (CONSTRAINTS §6).
    ui_editable: true

  - id: account.base_currency
    unit: ISO 4217
    value: USD
    status: owner
    provenance: owner
    read_by: swingdesk.trade_management.sizing:_to_base_currency
    named_in: [Appendix C - "FX-adjusted P&L", Appendix A - CAD/USD exposure]
    note: >-
      USD base with Canadian holdings means every .TO position carries a currency effect reported
      separately from asset return.
    ui_editable: false

  - id: account.fx_rate_cad
    unit: base currency (USD) per CAD
    value: null
    status: unset
    provenance: null
    read_by: swingdesk.trade_management.sizing:_to_base_currency
    named_in: [Appendix C - "FX-adjusted P&L", Appendix A - CAD/USD exposure]
    note: >-
      Rate converting a CAD-denominated risk or position value into account.base_currency.
      UNSET DELIBERATELY, and sizing refuses a CAD instrument while it stays unset. Until
      2026-08-16 sizing read account.equity (USD) as the numerator and divided it by a
      risk-per-share denominated in the INSTRUMENT's currency, so a .TO candidate was sized as
      though CAD were USD - an oversizing error of whatever the rate happens to be, silently, with
      no refusal and no record. Refusing is the fail-closed design working (AGENTS.md 3), not a
      gap: a rate is a measured market fact with an as-of, and guessing one to unblock a trade is
      exactly the substitution this registry exists to prevent.
      Setting it is an owner decision and needs a source and an as-of date, because a stale FX rate
      mis-sizes every Canadian position by the drift since it was recorded.
    ui_editable: true

  # ---- universe (A-tier by liquidity rule, owner decision 2026-08-01) ----
  - id: universe.min_price
    unit: USD
    value: 5.00
    status: assumed
    provenance: "assumed:DR-003"
    read_by: swingdesk.application.universe:rule_from_registry
    named_in: [M33-T0479]
    note: >-
      Same knob as screen.min_price but applied at universe construction, before screening. Costs
      about four names in a 115-instrument sample; it earns its place on the cost side, since below
      5.00 a one-cent spread is 20bp or worse.
    ui_editable: true

  - id: universe.min_adtv_20d
    unit: USD per day
    value: 5000000
    status: assumed
    provenance: "assumed:DR-003"
    read_by: swingdesk.application.universe:rule_from_registry
    named_in: [M33-T0481, Appendix A - Dollar volume]
    note: >-
      20-day average dollar volume. Chosen as the A-tier membership rule because it is computable
      from our own bars and needs no index constituent data - which no free source provides
      point-in-time, and which would stack a second survivorship bias on the delisting one. The
      measured distribution has a gap between the median (~1.2M) and p75 (~34M): membership moves by
      2 instruments in 115 between 5M and 10M, so the value sits on a plateau rather than a cliff.
    ui_editable: true

  - id: universe.min_bar_history
    unit: bars
    value: 250
    status: assumed
    provenance: "assumed:DR-003"
    read_by: swingdesk.application.universe:rule_from_registry
    named_in: [M72 - warm-up and sample requirements]
    note: >-
      Minimum daily history before an instrument is eligible; also bounds indicator warm-up. 250 is
      about one year and covers the longest warm-up currently in scope, SMA(200), with margin. An
      instrument that cannot warm up its inputs produces a candidate that silently never qualifies.
    ui_editable: true

  # ---- derived observations (docs/02-domain/ALGORITHM_SPEC.md) ----
  - id: atr.period
    unit: bars
    value: 14
    status: assumed
    provenance: "assumed:Wilder 1978, New Concepts in Technical Trading Systems"
    read_by: swingdesk.derived_observations.atr:compute
    named_in: [M18-T0280, M18-T0281, M27, M48-T0738]
    note: >-
      The course names ATR repeatedly and never gives a period. 14 is Wilder's original and the de
      facto standard, which makes it a convention rather than evidence - it has not been tested
      here and carries no claim about this universe.
    ui_editable: true

