    named_in: [M57-T0866, M71-T1067]
    note: >-
      Ratified by the owner 2026-08-17. Time exit at the close of session 20 after entry, if the stop
      has not been hit. The stop is checked FIRST on a bar satisfying both, so a bar that breaks the
      stop and completes the holding period is a stop-out, never a time exit.
      UNIT NOTE, not pedantry: this is trading days and ExitPolicy counts BARS. On the daily interval
      this system runs the two coincide exactly; they would not on any other interval, and
      ExitPolicy takes the number as max_holding_bars. Anything that ever feeds it intraday bars must
      convert - nothing does today.
