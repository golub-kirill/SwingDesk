      exit slot and a separate decision).
      assumed:DR-012, never assumed:PR-005 and never validated. PR-005 and PR-007 both HELD this
      value fixed as a study CONDITION; it was never among their findings, and PR-005 was refuted.
      The course quantifies nothing here - EXIT_MODEL_SPEC section 4 audits all 92 topics in M52-M58
      and finds no exit carrying a numeric parameter, naming this gap by name.
      Chosen for continuity of the only measurement basis that exists: PR-005-trades.csv, 26,351
      trades, was generated under exactly this value, and PR-009 varies the exit against it as the
      incumbent. Only PR-009 can move it off assumed.
    ui_editable: true

