    provenance: null
    named_in: [M10-T0166, M71-T1057]
    note: >-
      How many consecutive rising highs and rising lows constitute "higher highs and higher lows"
      for TrendDefinition.STRUCTURE. Two is the minimum that can express a direction; the course
      names the structure and no count.
    ui_editable: true
