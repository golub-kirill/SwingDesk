# The broker adapter's network policy, in one committed machine-readable file.
#
# Same instrument and same reasoning as `directory_pull_policy.yml`, which `DR-008` required and
# gate 22 enforces: the limits on what this project's software may ask of somebody else's server
# live in a committed file, so changing one is a commit a reviewer sees rather than an edited line.
#
# **Here the argument is stronger than it was there, and this is why the file exists at all.**
# A directory pull reads a public text file. This talks to a BROKERAGE ACCOUNT. Measured against
# Alpaca's own API reference on 2026-08-31: the account object carries no field saying whether the
# account is paper or live - `id`, `account_number`, `status`, `currency`, `equity`,
# `trading_blocked` and the rest are identical in both, and **the ONLY thing that distinguishes a
# paper account from a live one is which host was called.**
#
# So the host allowlist below is not configuration. It is the entire safety boundary, and
# `DR-014` ("no owner capital in the observable state of the project") rests on it.
#
# Gate 39 (`tools/verify_broker_policy.py`) checks this file against `swingdesk/broker/`: every key
# present and well-formed, the live host absent from the allowlist, no URL or limit written as a
# literal in the adapter, and no HTTP write verb anywhere in the package.

version: 1

venue:
  # Alpaca paper trading, chosen by the owner 2026-08-31 (`ADR-0005`).
  name: alpaca-paper
  label: Alpaca paper trading
  user_agent: swingdesk/0.0

  # **Which market this venue serves, as a `contracts.reference.Exchange` value.** Alpaca trades US
  # equities and does not trade the TSX, so a `.TO` position in this system's book is not something
  # the venue failed to report - it is a holding this venue cannot have. Declared here because the
  # reconciliation must tell the two apart: `AGENTS.md` 3 keeps USA and Canada separate, and a
  # Canadian position counted as an unrecorded exit would be that rule broken by an omission.
  market: NYSE

  # **The allowlist is the paper/live boundary.** One entry, and adding a second is the decision
  # this file exists to make visible. `APCA_API_BASE_URL` is Alpaca's own environment override and
  # is deliberately NOT read: an environment variable that can redirect this software at a live
  # brokerage is a boundary one shell export wide.
  base_url_allowlist:
    - https://paper-api.alpaca.markets

  # Named so the gate can assert it is absent from the allowlist rather than inferring it. A host
  # that is merely "not listed" is protected by an omission; one that is listed as forbidden is
  # protected by a check.
  forbidden_hosts:
    - api.alpaca.markets

access:
  # **Read-only, and the gate makes it structural rather than a promise.** `D1`/`BR-1` forbid this
  # system placing an order; `DR-026` records the owner's 2026-08-31 ruling on where that boundary
  # now sits and what is still closed. Until a policy change ships with that decision, the adapter
  # contains no write verb at all - which is a fact a gate can check, unlike an intention.
  write_enabled: false
  allowed_methods:
    - GET

  # NAMES of the environment variables, never values (`SECURITY.md` 2.1: environment variables or
  # an OS keyring, never a file in the repo). This repository is public and `tools/verify_secrets.py`
  # says so. Alpaca issues paper keys DISTINCT from live keys, so a paper key pasted here would
  # still be a secret in a public repo - the rule does not soften because the account is play money.
  key_env: APCA_API_KEY_ID
  secret_env: APCA_API_SECRET_KEY

limits:
  # 8 MiB. Applied to `Content-Length` AND to bytes actually read, so a server that omits or
  # misstates the header cannot bypass it. Larger than the directory pull's 2 MiB because an
  # activities page is JSON rather than a fixed text file, and smaller than anything that would sit
  # comfortably in memory unnoticed.
  max_response_bytes: 8388608

  # Seconds. One number, applied to each request.
  request_timeout_seconds: 30

  # A CEILING, not an obligation. The adapter retries zero times today, which is inside it.
  max_retries_per_attempt: 1
  retry_after_seconds: 60

  # Alpaca's documented maximum for the activities endpoint is 100; asking for more is refused by
  # the server rather than silently truncated, so this is its ceiling and not a preference.
  page_size: 100

  # How many activity pages one command may walk before it stops and says so. A paged endpoint with
  # no ceiling is the "unlimited retry inside one command" failure `DR-008` names, wearing a
  # different hat: the loop terminates on the server's token, and a server that keeps issuing one
  # would be followed for ever.
  max_pages: 50

endpoints:
  # Paths only. The host comes from the allowlist above, so no path here can reach another host.
  account: /v2/account
  positions: /v2/positions
  orders: /v2/orders
  activities: /v2/account/activities/{activity_type}

  # The one activity type this reads. `FILL` covers both full and partial fills - the `type` field
  # inside the record distinguishes them.
  activity_type: FILL
