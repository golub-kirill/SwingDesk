# The broker adapter's network policy, in one committed machine-readable file.
#
# Same instrument and same reasoning as `directory_pull_policy.yml`, which `DR-008` required and
# gate 22 enforces: the limits on what this project's software may ask of somebody else's server
# live in a committed file, so changing one is a commit a reviewer sees rather than an edited line.
#
# **Here the argument is stronger than it was there, and this is why the file exists at all.**
# A directory pull reads a public text file. This talks to a BROKERAGE ACCOUNT. Measured against
# Alpaca's own API reference on 2026-08-31: the account object carries no field saying whether the
# account is paper or live - `id`, `account_number`, `status`, `currency`, `equity`,
# `trading_blocked` and the rest are identical in both, and **the ONLY thing that distinguishes a
# paper account from a live one is which host was called.**
#
# So the host allowlist below is not configuration. It is the entire safety boundary, and
# `DR-014` ("no owner capital in the observable state of the project") rests on it.
#
# Gate 39 (`tools/verify_broker_policy.py`) checks this file against `swingdesk/broker/`: every key
# present and well-formed, the live host absent from the allowlist, no URL or limit written as a
# literal in the adapter, and no HTTP write verb anywhere in the package.

version: 1

venue:
  # Alpaca paper trading, chosen by the owner 2026-08-31 (`ADR-0005`).
  name: alpaca-paper
  label: Alpaca paper trading
  user_agent: swingdesk/0.0

  # **Which market this venue serves, as a `contracts.reference.Exchange` value.** Alpaca trades US
  # equities and does not trade the TSX, so a `.TO` position in this system's book is not something
  # the venue failed to report - it is a holding this venue cannot have. Declared here because the
  # reconciliation must tell the two apart: `AGENTS.md` 3 keeps USA and Canada separate, and a
  # Canadian position counted as an unrecorded exit would be that rule broken by an omission.
  market: NYSE

  # **The allowlist is the paper/live boundary.** One entry, and adding a second is the decision
  # this file exists to make visible. `APCA_API_BASE_URL` is Alpaca's own environment override and
  # is deliberately NOT read: an environment variable that can redirect this software at a live
  # brokerage is a boundary one shell export wide.
  base_url_allowlist:
    - https://paper-api.alpaca.markets

  # Named so the gate can assert it is absent from the allowlist rather than inferring it. A host
  # that is merely "not listed" is protected by an omission; one that is listed as forbidden is
  # protected by a check.
  forbidden_hosts:
    - api.alpaca.markets

access:
  # **Writing is permitted, and this line is one of the four independent guards.** `CHARTER` A-002
  # (owner, 2026-09-01) scopes A-001's human-only rule to real money; `DR-027` says what may be
  # submitted and what stops it. Turning this back to `false` disarms submission everywhere in one
  # commit a reviewer sees, which is `DR-008`'s *new human decision* applied to the highest-
  # consequence surface in this repository.
  #
  # **It is not the switch the owner uses day to day** - that is `write.kill_switch_file`, which
  # defaults to STOPPED and lives outside this repository. This flag is the standing permission;
  # that file is the arming.
  write_enabled: true
  allowed_methods:
    - GET
    # Submitting an order. `DELETE` is deliberately ABSENT: `DR-027` 3.3 gives every order
    # `time_in_force: day`, so an order this system placed expires with the session that decided
    # it and there is nothing to cancel. Adding cancellation is a policy change and a decision
    # record, not an argument to a function.
    - POST

  # NAMES of the environment variables, never values (`SECURITY.md` 2.1: environment variables or
  # an OS keyring, never a file in the repo). This repository is public and `tools/verify_secrets.py`
  # says so. Alpaca issues paper keys DISTINCT from live keys, so a paper key pasted here would
  # still be a secret in a public repo - the rule does not soften because the account is play money.
  key_env: APCA_API_KEY_ID
  secret_env: APCA_API_SECRET_KEY

limits:
  # 8 MiB. Applied to `Content-Length` AND to bytes actually read, so a server that omits or
  # misstates the header cannot bypass it. Larger than the directory pull's 2 MiB because an
  # activities page is JSON rather than a fixed text file, and smaller than anything that would sit
  # comfortably in memory unnoticed.
  max_response_bytes: 8388608

  # Seconds. One number, applied to each request.
  request_timeout_seconds: 30

  # A CEILING, not an obligation. The adapter retries zero times today, which is inside it.
  max_retries_per_attempt: 1
  retry_after_seconds: 60

  # Alpaca's documented maximum for the activities endpoint is 100; asking for more is refused by
  # the server rather than silently truncated, so this is its ceiling and not a preference.
  page_size: 100

  # How many activity pages one command may walk before it stops and says so. A paged endpoint with
  # no ceiling is the "unlimited retry inside one command" failure `DR-008` names, wearing a
  # different hat: the loop terminates on the server's token, and a server that keeps issuing one
  # would be followed for ever.
  max_pages: 50

endpoints:
  # Paths only. The host comes from the allowlist above, so no path here can reach another host.
  account: /v2/account
  positions: /v2/positions
  orders: /v2/orders
  activities: /v2/account/activities/{activity_type}

  # The one activity type this reads. `FILL` covers both full and partial fills - the `type` field
  # inside the record distinguishes them.
  activity_type: FILL

write:
  # **The kill switch, and it defaults to STOPPED.** A file the owner creates, resolved against the
  # data directory the command is given - never inside this repository, because a switch that ships
  # in a commit is a release rather than a switch. `data/` is gitignored.
  #
  # Absent means stopped. Unreadable means stopped. Present but not carrying the marker below means
  # stopped. Only the marker arms it. **A switch that defaults to ON is not a kill switch**, and one
  # that fails open is the `unavailable`-admits-unchecked inversion `DR-025` 2.1 records this
  # project paying for once already.
  kill_switch_file: .paper-trading-armed
  armed_marker: ARMED

  # `DR-027` 5. Derived from the SESSION DATE and the instrument, never from a run id and never
  # from a clock: a retried evening pass carries a new run id and would submit the same entry
  # twice. The venue rejects a duplicate, so idempotency is enforced by the party that actually
  # knows what it has accepted.
  client_order_id_prefix: swingdesk
  max_client_order_id_length: 128

  # `DR-027` 3. Each of these is argued in that record and none of them is a threshold.
  #   limit   - at the sizing price itself, which is the CHASE and LATE controls by construction
  #             and introduces no new number
  #   day     - an order that outlives the session outlives the analysis that produced it
  #   bracket - entry, stop and target in one chain. A stop the market cannot see is not a stop,
  #             and neither is a target: the owner ruled 2026-09-01 that a trade is carried from
  #             discovery to CLOSE and then observed, so the research data comes from a completed
  #             trade rather than from one that timed out.
  #
  # **The venue settled the class, and it did so by refusing.** The first real order went out as a
  # bracket with a stop leg only and came back `bracket orders require take_profit.limit_price`.
  # A bracket is a chain of THREE. `oto` would have taken one leg - and the owner's ruling arrived
  # in the same hour and made the target mandatory, so `bracket` is right for a reason that is not
  # the wire format. `DR-027` 9.
  # THE VENUE'S TICK, AND IT IS A FACT ABOUT THE VENUE RATHER THAN A CHOICE OF OURS - which is why
  # it lives here beside the host and not in `registry/parameters.yml`. SEC Rule 612, the sub-penny
  # rule: a US equity quoted at or above $1.00 may only be priced in whole cents, and below $1.00 in
  # $0.0001. Alpaca enforces it and says so - `invalid limit_price 66.949997. sub-penny increment
  # does not fulfill minimum pricing criteria`, which is how this was found: the first four real
  # orders this system ever sent were ALL rejected for it (`DR-033`).
  #
  # `universe.min_price` admits nothing under $5, so the sub-dollar tick is unreachable today. It is
  # declared anyway, because a rounding rule that silently did the wrong thing below a dollar would
  # be waiting for the day that floor moves.
  tick_size: "0.01"
  sub_dollar_tick: "0.0001"
  sub_dollar_threshold: "1.00"

  order_type: limit
  time_in_force: day
  order_class: bracket
  side: buy

  # ---------------------------------------------------------------------------
  # THE PROTECTIVE ORDER, and why it is a SECOND shape rather than a longer entry
  # ---------------------------------------------------------------------------
  # `DR-037`, owner ruling 2026-09-03. A bracket's legs inherit the entry's `time_in_force`, and
  # `DR-027` 3.3 makes that `day` for an argument that is exact about an ENTRY - an order outliving
  # its session outlives the analysis that produced it - and false about a PROTECTION, because the
  # position outlives the session too, by up to `exit.max_holding_period` of them.
  #
  # Measured 2026-09-03, the first day this system held anything: all three stop legs read
  # `canceled` and all three targets `expired` at the first close. Three holdings, no protection at
  # the venue, and a book still recording one.
  #
  # So the entry keeps `day` above and the protection gets its own shape here: `gtc`, so it lives
  # as long as the position does. `oco` because the two legs are alternatives - whichever fills
  # cancels the other, which is what "stop or target, never both" means on this venue's wire.
  # `sell` because it closes a long, and this system cannot describe any other kind.
  #
  # NO THRESHOLD IS SET HERE. The stop is the one already in the book and the target is
  # `exit.target_r_multiple` R above the recorded entry - the same rule `broker.submit.target_price`
  # already applies to an entry. Both are snapped by `DR-033`'s tick rule, stop UP and target DOWN.
  protect_time_in_force: gtc
  protect_order_class: oco
  protect_side: sell

  # Distinct from `client_order_id_prefix` because the venue rejects a duplicate id, and the entry
  # for this instrument on this session already used that one (`DR-027` 5). The idempotency
  # property is unchanged: one protective order per instrument per session, refused by the venue if
  # a second is attempted.
  protect_client_order_id_prefix: swingdesk-protect
