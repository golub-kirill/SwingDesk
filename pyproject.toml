[project]
name = "swingdesk"
version = "0.0.0"
description = "Swing-trading decision support for Canadian and US equities and ETFs"
requires-python = ">=3.12"
dependencies = [
    # Contracts (ADR-0003). The model class is the schema.
    "pydantic>=2",
    # Authoritative exchange calendar (ADR-0002) - NYSE and TSX differ on 30 sessions
    # over ~2.9 years, and the difference is not derivable from bar data.
    "pandas-market-calendars>=4",
    # `reference_data/calendar.py` imports pandas directly - the calendar is a DataFrame at the
    # boundary. It resolved anyway because pandas-market-calendars requires `pandas>=1.1`, so this
    # worked on every machine while being undeclared: the same defect as yfinance, one layer down,
    # and it would break the day that transitive requirement changed. Found by gate 17 on its
    # first run. The floor is >=2 rather than the inherited >=1.1 because nothing here has been
    # run against pandas 1.x; 3.0.5 is what the owner's environment resolves today.
    "pandas>=2",
    # The registries are YAML; tools/verify_parameters.py reads them.
    # tools/build_course_index.py and tools/verify_transcription.py stay stdlib-only so the
    # transcription checks run without an environment.
    "pyyaml>=6",
    # Bitemporal store and journal (ADR-0004). Embedded, columnar, single file.
    "duckdb>=1",
    # The v1 bar source (ADR-0001), and the pipeline's DEFAULT fetcher - `pipeline.run` falls back
    # to `vendor_yahoo.fetch` when no fetcher is injected, which is what the scheduled run uses.
    # `vendor_yahoo.fetch` imports it inside the function body, deliberately, so the package
    # imports and the whole gate suite runs with no network and no vendor installed. That laziness
    # is why this line was missing until 2026-08-10: a clean install SUCCEEDED and failed later, at
    # the first fetch - inside the 18:30 scheduled run, which is the one place a failure costs a
    # day of `a.run_completes`. Not an optional extra for the same reason.
    "yfinance>=1",
]

[project.scripts]
# `swingdesk scan` is written as a real command in SYSTEM_MODES, UX_TASK_FLOWS, ALLOCATION_SPEC and
# ROADMAP 4 (which marks it done). Until 2026-08-10 it was not one: there was no entry point, and
# the only way to run it was `python -m swingdesk.presentation.cli scan`. What made this hard to
# see is that `argparse` is constructed with `prog="swingdesk"`, so --help printed a command name
# that could not be typed. Declared here so the documented name and the runnable name are the same.
#
# `tools/daily_run.cmd` deliberately keeps calling `-m swingdesk.presentation.cli`: it runs the
# venv interpreter by absolute path, and a module invocation cannot resolve to a stale console
# script left over from an earlier install.
swingdesk = "swingdesk.presentation.cli:main"

[project.optional-dependencies]
# Everything the merge gates need. Declared here rather than only in requirements-lock.txt, because
# a gate whose tooling is undeclared is a gate that stops running on a fresh checkout.
dev = [
    "pytest>=8",
    "hypothesis>=6",      # property tests carry the invariants (TEST_STRATEGY 2)
    "import-linter>=2",   # the dependency law, executed (DEPENDENCY_LAW)
    "ruff>=0.16",         # gate 4
    "mypy>=1.10",         # gate 5
    "types-PyYAML",       # the registries are YAML and every gate script reads them
    "pandas-stubs",       # the calendar is a DataFrame at the boundary
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561. Without this marker mypy treats THIS project's own fully-typed package as untyped the
# moment it is imported from outside `src/` - so every `tools/` script got `Any` for every symbol
# it imported from `swingdesk`, and 142 of the 247 errors `mypy tools/` reported were that one
# fact repeated. Worse than the count: the type checker was blind at the one boundary where a tool
# meets the system, which is where a wrong argument actually gets written.
[tool.setuptools.package-data]
swingdesk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
# The shipped package, AND the machinery that checks it - the gates, the generators and the state
# builder. The research runners stay out.
#
# ~~The shipped package only.~~ That was the position from 2026-08-10 to 2026-08-30, and the
# argument for it was sound: a gate covering `src` cleanly is worth more than one covering
# everything and failing. What changed is the size of the job, and it changed because of one
# missing file rather than because anyone annotated 140 lines.
#
# **`src/swingdesk/py.typed` did not exist.** Without that PEP 561 marker mypy treats this
# project's own fully-typed package as UNTYPED the moment it is imported from outside `src/`, so
# every `tools/` script got `Any` for every symbol it imported from `swingdesk`. 142 of the 247
# errors were that one fact repeated - and far worse than the count, the checker was blind at the
# one boundary where a tool meets the system, which is exactly where a wrong argument gets
# written. With the marker the whole of `tools/` reports 113, and the checking machinery reports
# ZERO once the annotations below it were added.
#
# It found one thing immediately that review could not: `verify_reproducible.py` compared two
# `str | None` hashes declared as `list[str]`, so two passes that produced NOTHING would have
# compared equal and printed byte-identical evidence for `a.reproducible`.
#
# The research runners (`run_pr*.py`, `measure_*.py`, `probe_*.py`) are still out of scope and
# `CI_POLICY.md` §7 tracks them. Derive the remaining count, never quote it from here:
# `PYTHONPATH=$PWD/src python -m mypy tools/`.
files = [
    "src",
    "tools/verify_*.py",
    "tools/build_*.py",
    "tools/check_gates.py",
    "tools/track_a_streak.py",
]

# Third-party packages that ship no type information. Listed one by one rather than with a global
# `ignore_missing_imports`, so adding an untyped dependency is a visible decision rather than
# something the config already silently permits.
[[tool.mypy.overrides]]
module = ["pandas_market_calendars.*", "yfinance.*", "duckdb.*"]
ignore_missing_imports = true

[tool.ruff]
# 110, not the 100 declared before ruff was ever run against the tree. 100 was aspirational and
# unenforced: 51 lines violated it, all but four by one or two characters, and nearly all of them
# prose in a docstring or a comment. Rewrapping those would have edited explanatory text in thirty
# files to move a single word - and an attempt to do it mechanically produced worse prose than it
# replaced, which is the argument in miniature.
#
# 110 is where this codebase actually writes. It still catches the four genuinely runaway lines,
# and it is now ENFORCED rather than aspirational. A limit nobody meets is not a standard; it is a
# gate waiting to be bypassed (CI_POLICY 3).
line-length = 110
src = ["src", "tools", "tests"]

# Rules chosen deliberately. Left unconfigured, ruff reported 199 findings, 85 of them a single
# preview rule wanting Decimal("100") rewritten as Decimal(100) - a change this codebase should not
# make by habit, since the string form is the only correct one for a float and money is Decimal
# everywhere. A gate whose contents nobody picked is a gate that gets bypassed (CI_POLICY 3).
[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import ordering, so a diff never churns on it
    "UP",       # py3.12+ idioms
    "B",        # bugbear: mutable defaults, shadowed loop vars
    "ARG",      # unused arguments - catches a parameter that stopped being read
    "DTZ",      # naive datetimes. Load-bearing here: every stored time is tz-aware
    "SLF",      # private access across module boundaries
    "BLE",      # blind `except Exception`
    "PLW0127",  # self-assignment. Added after ruff's own UP017 autofix produced `UTC = UTC`
                # in twelve test files - the import it introduced shadowed the module constant
                # it was assigning. An autofix can create dead code; the gate now catches it.
    "RUF",
]
ignore = [
    # Ambiguous-unicode rules. This codebase quotes its Russian-language source verbatim in
    # docstrings and skip reasons, so Cyrillic characters that "look like" Latin ones are the
    # point, not a typo. Leaving these on would train the operator to ignore ruff output.
    "RUF001", "RUF002", "RUF003",
    # RUF005 (concatenation -> unpacking) collapses annotated bar-by-bar test fixtures into one
    # unreadable line. In test_backtest the per-row comments ARE the documentation of what each
    # session is meant to do, and a style rule that deletes them is a net loss.
    "RUF005",
]

# `ANN` (missing annotations) is deliberately NOT selected. Turning it on produced 129 findings,
# almost all in tests, where the annotation adds nothing a reader did not already know from the
# fixture. `mypy --strict` already requires annotations on everything it checks - `src`, per
# [tool.mypy] above - which is where they carry weight. Two overlapping gates disagreeing about
# scope is how a gate starts getting bypassed.
#
# This comment read "(src and tools)" until 2026-08-10, contradicting `files = ["src"]` forty
# lines up in the same file. The rationale for leaving ANN off rested on coverage that the same
# file disproved. `tools/` is covered by neither gate; that is the open item, not this one.

[tool.ruff.lint.per-file-ignores]
# Research tools bootstrap sys.path before importing swingdesk, so their imports cannot come first.
"tools/*.py" = ["E402"]
# Tests reach into internals on purpose - that is the point of a white-box test - and their unused
# arguments are pytest fixtures requested for their side effects.
"tests/*.py" = ["SLF", "ARG"]
# Embeds the NASDAQ Trader header row verbatim inside a fixture string. Wrapping it would change the
# format the parser is being tested against, and a `# noqa` inside a string literal is text.
"tests/test_universe.py" = ["SLF", "ARG", "E501"]

[tool.importlinter]
root_package = "swingdesk"

# Dependency law (docs/06-engineering/DEPENDENCY_LAW.md). Transcribed from the course's own
# component-independence rules: indicators do not own decisions, patterns produce observations not
# orders, strategies do not fetch their own facts.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "swingdesk.presentation",
    "swingdesk.validation",
    "swingdesk.application",
    "swingdesk.trade_management",
    "swingdesk.decision_logic",
    "swingdesk.derived_observations",
    "swingdesk.market_data",
    # A brokerage account is a Source Fact in the course's sense - it says what happened at a
    # venue, in the past tense - so it sits with the other two adapters and above
    # `reference_data`, whose calendar it reads to tell a US instrument from a Canadian one.
    # `ADR-0005` places it and says why it is not a service outside the chain.
    "swingdesk.broker",
    "swingdesk.reference_data",
    "swingdesk.platform",
]

[[tool.importlinter.contracts]]
name = "Strategies do not fetch their own facts"
type = "forbidden"
source_modules = ["swingdesk.derived_observations", "swingdesk.decision_logic"]
# `swingdesk.broker` is here for the course rule's own reason: a strategy that could ask the
# venue what it holds would be fetching its own version of a shared fact, and the book is the
# most consequential shared fact this system has.
forbidden_modules = ["swingdesk.market_data", "swingdesk.broker"]

# journal_evidence is a persistence service, not a layer: trade_management, application, validation
# and presentation write to it, but the pure layers must stay side-effect free.
[[tool.importlinter.contracts]]
name = "Pure layers do not journal"
type = "forbidden"
source_modules = ["swingdesk.derived_observations", "swingdesk.decision_logic"]
forbidden_modules = ["swingdesk.journal_evidence"]

[[tool.importlinter.contracts]]
name = "Journal depends only on platform"
type = "forbidden"
source_modules = ["swingdesk.journal_evidence"]
forbidden_modules = [
    "swingdesk.market_data",
    "swingdesk.broker",
    "swingdesk.reference_data",
    "swingdesk.derived_observations",
    "swingdesk.decision_logic",
    "swingdesk.trade_management",
    "swingdesk.application",
    "swingdesk.validation",
    "swingdesk.presentation",
]
